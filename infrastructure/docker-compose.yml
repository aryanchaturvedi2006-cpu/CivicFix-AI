version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: civicfix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicfix
      POSTGRES_PASSWORD: civicfix_secret
      POSTGRES_DB: civicfix_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicfix -d civicfix_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
